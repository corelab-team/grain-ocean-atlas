name: Build offline Windows application

on:
  workflow_dispatch:
  push:
    branches: [codex/export-only]
    tags: ['export-v*']
    paths:
      - 'electron/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'dist/export-only/**'
      - '.github/workflows/electron.yml'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec electron-builder --win --x64 --publish never
      - name: Write checksums
        shell: pwsh
        run: |
          Get-ChildItem release/*.zip, release/*-Setup.exe | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content release/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: grain-export-atlas-windows-x64
          path: |
            release/*.zip
            release/*-Setup.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/export-v')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: grain-export-atlas-windows-x64
          path: release
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$env:GITHUB_REF_NAME"
          release/*-Setup.exe release/*.zip release/SHA256SUMS.txt
          --repo "$env:GITHUB_REPOSITORY"
          --title "Маршруты экспорта — Windows $env:GITHUB_REF_NAME"
          --notes-file electron/release-notes.md --verify-tag
